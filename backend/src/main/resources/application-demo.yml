spring:
  datasource:
    url: jdbc:h2:file:./data/sngone;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
sng:
  seed: true
  demo-one-click: true
  storefront-boost: true
  jwt:
    secret: sng-one-demo-secret-change-in-production-2026-hardware
